<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Directions Test</title>
  <style>
    #mapFrame { width: 100%; height: 450px; border: 0; }
  </style>
</head>
<body>

  <input id="postcodeInput" type="text" placeholder="Enter postcode">
  <button id="goBtn">Get Directions</button>

  <p id="status"></p>

  <iframe
    id="mapFrame"
    loading="lazy"
    referrerpolicy="no-referrer-when-downgrade"
    allowfullscreen>
  </iframe>

  <script>
    const defaultPostcode = "WA8 7DL";
    const destination = "L24 7RN";
    const apiKey = "AIzaSyDAp6Ygh48F1jgYe4-b-B691uKTC2k_SXk";

    function showDirections() {
      const status = document.getElementById("status");
      let origin = document.getElementById("postcodeInput").value.trim();

      if (!origin) {
        origin = defaultPostcode;
        document.getElementById("postcodeInput").value = defaultPostcode;
      }

      const url =
        `https://www.google.com/maps/embed/v1/directions?key=${apiKey}` +
        `&origin=${encodeURIComponent(origin)}` +
        `&destination=${encodeURIComponent(destination)}` +
        `&mode=driving`;

      console.log("MAP URL:", url);
      status.textContent = "Loading map...";

      document.getElementById("mapFrame").src = url;
    }

    document.getElementById("goBtn").addEventListener("click", showDirections);
  </script>

</body>
</html>
